[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for commit in commits %}
    {% if commit.scope %}\
        * **{{ commit.scope }}:** {% if commit.breaking %}[BREAKING] {% endif %}\
    {% else %}\
        * {% if commit.breaking %}[BREAKING] {% endif %}\
    {% endif %}\
    {{ commit.message | upper_first }}\
    ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\n
"""
trim = true
footer = """
---
*Generated by [git-cliff](https://github.com/orhun/git-cliff)*
"""

[git]
conventional_commits = true
commit_parsers = [
    { pattern = "^feat", group = "Features" },
    { pattern = "^fix", group = "Bug Fixes" },
    { pattern = "^doc", group = "Documentation" },
    { pattern = "^perf", group = "Performance" },
    { pattern = "^refactor", group = "Refactoring" },
    { pattern = "^style", group = "Styling" },
    { pattern = "^test", group = "Testing" },
    { pattern = "^chore\\(release\\)", skip = true },
    { pattern = "^chore\\(deps.*\\)", skip = true },
    { pattern = "^chore\\(pr\\)", skip = true },
    { pattern = "^chore\\(pull\\)", skip = true },
    { pattern = "^chore|^ci", group = "Miscellaneous" },
]
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
